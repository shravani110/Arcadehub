<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0c10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Arcade Hub • Instant Web Games</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Inter:wght@400;600;700;800;900&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Inter:wght@400;600;700;800;900&display=swap"></noscript>
</head>
<body>
  <div id="app">
    <div id="app-initial-loader" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#0a0c10;color:#94a3b8;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;font-size:15px;font-weight:700;letter-spacing:1px;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
        <div style="width:36px;height:36px;border:3px solid rgba(255,255,255,0.15);border-top-color:#10b981;border-radius:50%;animation:arcadeSpin 0.8s linear infinite;"></div>
        <div>LOADING ARCADE HUB...</div>
      </div>
      <style>
        @keyframes arcadeSpin { to { transform: rotate(360deg); } }
      </style>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
